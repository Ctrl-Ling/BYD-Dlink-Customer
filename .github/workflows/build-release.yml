name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release.keystore

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      env:
        KEYSTORE_PATH: release.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Get version info
      id: version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle | awk '{print $2}' | tr -d '"')
        VERSION_CODE=$(grep 'versionCode' app/build.gradle | awk '{print $2}')
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

    - name: Rename APK
      run: |
        mv app/build/outputs/apk/release/app-release-unsigned.apk app/build/outputs/apk/release/BYD-Dlink-Customer-v${{ steps.version.outputs.version_name }}.apk 2>/dev/null || \
        mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/BYD-Dlink-Customer-v${{ steps.version.outputs.version_name }}.apk

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: BYD Dlink Customer v${{ steps.version.outputs.version_name }}
        body: |
          ## BYD Dlink Customer v${{ steps.version.outputs.version_name }} (Code ${{ steps.version.outputs.version_code }})
          
          ### 更新内容
          - 自动构建版本
          
          ### 安装说明
          1. 下载 APK 文件
          2. 允许安装未知来源应用
          3. 安装并授予 LSPosed 模块权限
        files: |
          app/build/outputs/apk/release/BYD-Dlink-Customer-v${{ steps.version.outputs.version_name }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      with:
        name: BYD-Dlink-Customer-v${{ steps.version.outputs.version_name }}
        path: app/build/outputs/apk/release/BYD-Dlink-Customer-v${{ steps.version.outputs.version_name }}.apk
        retention-days: 30
